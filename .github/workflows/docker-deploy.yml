name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.filter.outputs.back }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 변경된 경로 감지
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            back:
              - 'back/**'
            front:
              - 'front/**'

  build-and-push-back:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 백엔드 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./back
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nbe10-12-2-utf-8-back:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: EC2 배포 (SSM)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nbe10-12-2-utf-8-back:latest
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=tangbisil-ec2-1" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          SCRIPT=$(cat <<DEPLOY
          docker pull $IMAGE
          docker stop backend 2>/dev/null || true
          docker rm backend 2>/dev/null || true
          docker run -d --name backend --network common -p 8080:8080 --env-file /etc/backend.env --restart unless-stopped $IMAGE
          docker rmi \$(docker images -f dangling=true -q) 2>/dev/null || true
          DEPLOY
          )

          PARAMS=$(jq -n --arg cmd "$SCRIPT" '{"commands":[$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")
          STATUS=$(echo "$OUTPUT" | jq -r '.Status')
          echo "Status: $STATUS"
          echo "$OUTPUT" | jq -r '.StandardOutputContent'
          echo "$OUTPUT" | jq -r '.StandardErrorContent'
          [ "$STATUS" = "Success" ] || exit 1

      - name: Railway 백엔드 재배포 트리거
        run: |
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation serviceInstanceRedeploy($serviceId: String!, $environmentId: String!) { serviceInstanceRedeploy(serviceId: $serviceId, environmentId: $environmentId) }",
              "variables": {
                "serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}",
                "environmentId": "7bb326a9-c879-4457-a33d-f0605d23ae75"
              }
            }' \
            https://backboard.railway.app/graphql/v2)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"

          # GraphQL은 HTTP 200이어도 body에 errors가 담겨 실패할 수 있어 상태코드만으론 판별 불가
          if [ "$http_code" -ge 400 ] || echo "$body" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::Railway 백엔드 재배포 트리거 실패 (HTTP $http_code): $body"
            exit 1
          fi

  build-and-push-front:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 프론트엔드 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./front
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://nbe10-12-2-utf-8-back-production.up.railway.app/
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nbe10-12-2-utf-8-front:latest

      - name: Railway 프론트 재배포 트리거
        run: |
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation serviceInstanceRedeploy($serviceId: String!, $environmentId: String!) { serviceInstanceRedeploy(serviceId: $serviceId, environmentId: $environmentId) }",
              "variables": {
                "serviceId": "${{ secrets.RAILWAY_FRONT_SERVICE_ID }}",
                "environmentId": "7bb326a9-c879-4457-a33d-f0605d23ae75"
              }
            }' \
            https://backboard.railway.app/graphql/v2)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"

          # GraphQL은 HTTP 200이어도 body에 errors가 담겨 실패할 수 있어 상태코드만으론 판별 불가
          if [ "$http_code" -ge 400 ] || echo "$body" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::Railway 프론트 재배포 트리거 실패 (HTTP $http_code): $body"
            exit 1
          fi