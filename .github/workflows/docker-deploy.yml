name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.filter.outputs.back }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 변경된 경로 감지
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            back:
              - 'back/**'

  build-and-push-back:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 백엔드 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./back
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nbe10-12-2-utf-8-back:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: EC2 배포 (SSM)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nbe10-12-2-utf-8-back:latest
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=tangbisil-ec2-1" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          SCRIPT=$(cat <<DEPLOY
          docker pull $IMAGE
          docker stop backend 2>/dev/null || true
          docker rm backend 2>/dev/null || true
          docker run -d --name backend --network common -p 8080:8080 --env-file /etc/backend.env --restart unless-stopped $IMAGE
          docker rmi \$(docker images -f dangling=true -q) 2>/dev/null || true
          DEPLOY
          )

          PARAMS=$(jq -n --arg cmd "$SCRIPT" '{"commands":[$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")
          STATUS=$(echo "$OUTPUT" | jq -r '.Status')
          echo "Status: $STATUS"
          echo "$OUTPUT" | jq -r '.StandardOutputContent'
          echo "$OUTPUT" | jq -r '.StandardErrorContent'
          [ "$STATUS" = "Success" ] || exit 1